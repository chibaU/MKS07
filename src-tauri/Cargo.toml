[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
# مهمة 1/2 من ميزة طباعة الفاتورة: قراءة القيم النصية لخلايا قالب xlsx المرفوع
# من المستخدم (فحص الكلمات المفتاحية فقط في هذه المهمة — لا قراءة أنماط/تنسيق
# بعد، ذلك مؤجَّل لمهمة التعبئة/الطباعة اللاحقة).
umya-spreadsheet = "2"
# مهمة 2/2: تعبئة القالب وفتحه مباشرة (بدل توليد PDF مخصَّص — راجع الملاحظة
# المعمارية أعلى رأس invoice_template.rs لسبب هذا الاختيار).
# tauri-plugin-opener: فتح ملف xlsx المولَّد بتطبيق الجداول الافتراضي على
# جهاز المستخدم (Excel أو LibreOffice Calc) من طرف الواجهة (JS) — ممنوع أي
# أمر طباعة صامت/برمجي (القرار المعماري رقم 2)؛ المستخدم يطبع يدوياً من
# داخل ذلك التطبيق.
tauri-plugin-opener = "2"
# zip: يُستخدَم فقط لإصلاح ثغرة فقدان خاصية rightToLeft عند إعادة الكتابة —
# راجع التعليق المفصَّل أعلى detect_sheet_rtl/apply_rtl_view_to_output في
# invoice_template.rs. umya-spreadsheet نفسه يستخدم zip داخلياً أصلاً، هذا
# فقط يجعله تبعية مباشرة كي نعالج سطراً واحداً من XML الخام بأنفسنا.
zip = { version = "2", default-features = false, features = ["deflate"] }
# ميزة تفعيل الجهاز (راجع AI_CONTEXT.md، القسم 9): يُقارَن كود التفعيل الذي
# يكتبه المستخدم ببصمة SHA-256 مخزَّنة في activation.rs، لا بنص الكود الصريح —
# حتى لا يظهر الكود السري نفسه كنص قابل للقراءة داخل الملف التنفيذي النهائي.
sha2 = "0.10"
