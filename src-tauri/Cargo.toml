[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
# مهمة 1/2 من ميزة طباعة الفاتورة: قراءة القيم النصية لخلايا قالب xlsx المرفوع
# من المستخدم (فحص الكلمات المفتاحية فقط في هذه المهمة — لا قراءة أنماط/تنسيق
# بعد، ذلك مؤجَّل لمهمة التعبئة/الطباعة اللاحقة).
umya-spreadsheet = "2"
# مهمة 2/2: تعبئة القالب وفتحه مباشرة (بدل توليد PDF مخصَّص — راجع الملاحظة
# المعمارية أعلى رأس invoice_template.rs لسبب هذا الاختيار).
# tauri-plugin-opener: فتح ملف xlsx المولَّد بتطبيق الجداول الافتراضي على
# جهاز المستخدم (Excel أو LibreOffice Calc) من طرف الواجهة (JS) — أصبح الآن
# المسار الاحتياطي اليدوي فقط (فشل الطباعة الصامتة أدناه)، بعد تحديث لاحق
# صريح يُلغي جزئياً القرار المعماري رقم 2 الأصلي (راجع الملاحظة المعمارية
# أعلى رأس invoice_template.rs).
# مهمة 3/2 (لاحقة): طباعة صامتة مباشرة عبر استدعاء soffice.exe (LibreOffice)
# من سطر الأوامر مباشرة عبر std::process::Command — لا تبعية Cargo إضافية
# لهذا الجزء، فقط مكتبة Rust القياسية (std::process/std::os::windows).
tauri-plugin-opener = "2"
# zip: يُستخدَم فقط لإصلاح ثغرة فقدان خاصية rightToLeft عند إعادة الكتابة —
# راجع التعليق المفصَّل أعلى detect_sheet_rtl/apply_rtl_view_to_output في
# invoice_template.rs. umya-spreadsheet نفسه يستخدم zip داخلياً أصلاً، هذا
# فقط يجعله تبعية مباشرة كي نعالج سطراً واحداً من XML الخام بأنفسنا.
zip = { version = "2", default-features = false, features = ["deflate"] }
# ميزة تفعيل الجهاز (راجع AI_CONTEXT.md، القسم 9): يُقارَن كود التفعيل الذي
# يكتبه المستخدم ببصمة SHA-256 مخزَّنة في activation.rs، لا بنص الكود الصريح —
# حتى لا يظهر الكود السري نفسه كنص قابل للقراءة داخل الملف التنفيذي النهائي.
sha2 = "0.10"

# ───────────────────────── ميزة مزامنة الهاتف (معزولة) ─────────────────────────
# راجع AI_CONTEXT.md القسم 10 وتعليق رأس src/phone_sync/mod.rs. كل ما يلي يخدم
# هذه الميزة وحدها: خادم HTTPS محلي (hyper + rustls) يقدّم تطبيق الهاتف ويستقبل
# الفواتير. مزوّد التشفير ring صراحةً (لا aws-lc-rs: لا يحتاج NASM/CMake على ويندوز).
# تعمل الخدمة في runtime خاص (tokio) منفصل عن runtime الخاص بـ Tauri.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# شهادة جذر محلية + شهادة خادم تغطي عناوين الشبكة (x509-parser لإعادة تحميل الجذر المحفوظ)
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring", "x509-parser"] }
ring = "0.17"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
time = { version = "0.3", features = ["formatting"] }
# يضمّن مجلد phone-app/ (تطبيق الهاتف) داخل الملف التنفيذي. allow_missing: غياب
# المجلد لا يكسر بناء MKS الأساسي.
rust-embed = "8"

