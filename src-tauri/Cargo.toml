[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-single-instance = "2"
# ميزة تفعيل الجهاز (راجع activation.rs): يُقارَن كود التفعيل الذي يكتبه
# المستخدم ببصمة SHA-256 مخزَّنة هناك، لا بنص الكود الصريح.
sha2 = "0.10"

# الطباعة الأصلية عبر WebView2 (src/print/backend/webview2.rs) — ويندوز فقط.
# ⚠️ يجب أن تطابق النسختان ما يحلّه tauri نفسه، وإلا لا تتطابق أنواع COM:
#   tauri 2.11.x ← webview2-com 0.38 / windows 0.61
#   tauri 2.12.x ← webview2-com 0.39 / windows 0.62
# تحقّق دائماً بعد أي تحديث لـtauri:  cargo tree -i webview2-com
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
